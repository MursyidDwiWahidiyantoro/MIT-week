<!doctype html>
<html lang="id" data-motion="calm" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070302" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <!-- Applies stored display preferences before the first paint, so a
         returning visitor never sees the page restyle (and the first render
         is not followed by a full-document style recalculation). Its CSP
         hash is computed from this file in vite.config.ts. -->
    <script>(function(){try{var d=document.documentElement,s=localStorage,m=s.getItem('amba.mode'),r=matchMedia('(prefers-reduced-motion: reduce)').matches;if(m==='explore'||m==='essential')d.dataset.mode=m;d.dataset.motion=m==='essential'||r?'calm':'full';if(s.getItem('amba-theme')==='light')d.dataset.theme='light';var x=Number(s.getItem('amba.textScale'));if(x===125||x===150)d.style.setProperty('--text-scale',String(x/100));var l=s.getItem('amba.lang');if(l==='en'||l==='id')d.lang=l}catch(e){}})();</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
