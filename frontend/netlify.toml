# Netlify deployment for the static SPA.
#
# Why Netlify over Vercel for this project: the free (Starter) tier permits
# commercial use, while Vercel's Hobby tier is restricted to non-commercial
# personal projects. This app is competition/portfolio work that may become a
# product, so the licence terms decide it. Both hosts can serve this build.
#
# The Go API is NOT deployed here: it is a long-running server with 20 s SSE
# streams and outbound fetching, which does not fit a serverless function.
# Point VITE_API_BASE_URL at that server (see docs/DEPLOY.md), or build with
# VITE_API_MODE=mock for an honest preview-only deployment.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: every route is client-rendered, so unknown paths must return
# index.html with a 200 (not Netlify's default 404 page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The page CSP is emitted by SvelteKit (csp.mode = 'hash'). Only the
    # directives that cannot live in a meta tag are set here.
    Content-Security-Policy = "frame-ancestors 'none'"

# Hashed assets are immutable; the service worker and the shell are not.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
