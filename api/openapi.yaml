openapi: 3.0.3
info:
  title: AMBA API
  version: 1.0.0
  description: |
    Aplikasi Mengenali & Bertindak Aman — hoax/phishing checker.
    The verdict is computed in Go (internal/scoring); the LLM never returns a score.
    Errors always use the ErrorEnvelope shape.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                required: [status]

  /audit/url:
    post:
      operationId: auditURL
      summary: Audit a link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 2048 }
              required: [url]
      responses:
        "200":
          description: Final Dossier (JSON mode) or SSE stream when Accept is text/event-stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504": { $ref: "#/components/responses/UpstreamTimeout" }

  /audit/file:
    post:
      operationId: auditFile
      summary: Audit a screenshot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                ocr_text: { type: string }
              required: [file]
      responses:
        "200":
          description: Final Dossier or SSE stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /audit/text:
    post:
      operationId: auditText
      summary: Audit a text message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 5000 }
              required: [text]
      responses:
        "200":
          description: Final Dossier or SSE stream
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /verify:
    post:
      operationId: verifyToken
      summary: Verify a signed share token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  payload:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string }
                      ts: { type: string }
                      status: { $ref: "#/components/schemas/Status" }
                      score: { type: integer, nullable: true }
                      title: { type: string, maxLength: 80 }
                      claim: { type: string, maxLength: 120 }
                      srcs:
                        type: array
                        maxItems: 3
                        items:
                          type: object
                          properties:
                            pub: { type: string }
                            url: { type: string }
                            m: { $ref: "#/components/schemas/FactStatus" }
                required: [valid]

  /reply:
    post:
      operationId: reply
      summary: Draft a polite reply from a share token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                tone:
                  type: string
                  enum: [hormat, santai, singkat]
              required: [token, tone]
      responses:
        "200":
          description: Reply text
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string, maxLength: 280 }
                  source: { type: string, enum: [llm, template] }
                required: [text, source]
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /demo/{id}:
    get:
      operationId: getDemo
      summary: Fetch a bundled demo Dossier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]{4,40}$"
      responses:
        "200":
          description: Demo Dossier (is_demo true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
        "404":
          description: Unknown demo id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PayloadTooLarge:
      description: Upload exceeds the size limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMedia:
      description: File type not supported
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UpstreamTimeout:
      description: A dependency did not answer in time; no verdict exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Status:
      type: string
      enum: [SAFE, SUSPICIOUS, TAMPERED, INSUFFICIENT]

    FactStatus:
      type: string
      enum: [CONTRADICTS, SUPPORTS, UNVERIFIED]

    InputType:
      type: string
      enum: [URL, FILE, TEXT]

    Anomaly:
      type: object
      properties:
        bounding_box:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0, maximum: 1000 }
          description: Normalized [ymin, xmin, ymax, xmax] on a 0-1000 scale
        extracted_text: { type: string }
        reason: { type: string }
      required: [bounding_box]

    Source:
      type: object
      properties:
        title: { type: string }
        publisher: { type: string }
        url: { type: string }
        match: { $ref: "#/components/schemas/FactStatus" }
      required: [title, publisher, url, match]

    LinkReason:
      type: object
      properties:
        code: { type: string }
        text: { type: string }
      required: [code, text]

    Tactic:
      type: object
      properties:
        code:
          type: string
          enum:
            [URGENCY, REWARD_BAIT, FALSE_AUTHORITY, FEAR, SECRECY,
             OUTRAGE_BAIT, IMPERSONATION, FAKE_SOCIAL_PROOF]
        phrase: { type: string, maxLength: 80 }
        source: { type: string, enum: [text, ocr] }
      required: [code, phrase, source]

    Verdict:
      type: object
      properties:
        score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: RISK score, not confidence. Null when INSUFFICIENT.
        status: { $ref: "#/components/schemas/Status" }
        short_title: { type: string }
        explanation: { type: string, maxLength: 400 }
        explanation_simple: { type: string, maxLength: 140 }
        basis:
          type: array
          items: { type: string, enum: [ela, ai, fact, link, llm_untrusted] }
        not_checked:
          type: array
          items: { type: string, enum: [ela, ai, fact, link] }
        floors_applied:
          type: array
          items:
            type: string
            enum: [FACT_CONTRADICTED, LINK_MALICIOUS, SCAM_PATTERN, LINK_STRONG, ELA_CORROBORATED,
                   ELA_SOLO_CAP, INJECTION_GUARD]
        scam_pattern:
          type: string
          nullable: true
          enum: [CREDENTIAL_REQUEST, APK_LURE, WRONG_TRANSFER, JOB_SCAM, INVESTMENT_SCAM,
                 PRIZE_FEE, LOAN_FEE, MONEY_PRESSURE, ACCOUNT_THREAT, UNOFFICIAL_CONTACT,
                 CALL_FORWARD, null]
          description: >
            The scam pattern behind SCAM_PATTERN, found by deterministic rules in
            the message, the link's caption or the text read from an image.
            Null when no pattern was found.
      required: [status, explanation, explanation_simple, basis, not_checked, floors_applied]

    Pillars:
      type: object
      properties:
        ela:
          type: object
          properties:
            available: { type: boolean }
            score: { type: integer }
            reliability: { type: number, minimum: 0, maximum: 1 }
            reliability_note: { type: string, nullable: true }
            anomalies:
              type: array
              items: { $ref: "#/components/schemas/Anomaly" }
          required: [available, score, reliability]
        ai:
          type: object
          properties:
            available: { type: boolean }
            score: { type: integer }
            indicators: { type: array, items: { type: string } }
            caveat: { type: string }
          required: [available, score]
        fact:
          type: object
          properties:
            available: { type: boolean }
            claim: { type: string }
            status: { $ref: "#/components/schemas/FactStatus" }
            sources:
              type: array
              items: { $ref: "#/components/schemas/Source" }
          required: [available, status]
        link:
          type: object
          properties:
            available: { type: boolean }
            score: { type: integer }
            final_url: { type: string }
            redirect_chain: { type: array, items: { type: string } }
            reasons:
              type: array
              items: { $ref: "#/components/schemas/LinkReason" }
          required: [available, score]

    Dossier:
      type: object
      properties:
        schema_version: { type: integer, enum: [2] }
        id: { type: string, example: AMBA-20261030-7F3K }
        timestamp: { type: string, format: date-time }
        input_type: { $ref: "#/components/schemas/InputType" }
        source_reference: { type: string, maxLength: 200 }
        degraded: { type: boolean }
        is_demo: { type: boolean }
        verdict: { $ref: "#/components/schemas/Verdict" }
        pillars: { $ref: "#/components/schemas/Pillars" }
        tactics:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Tactic" }
        share_token: { type: string }
        source_metadata:
          description: >
            Public description of the submitted link (PRD F1), read via oEmbed
            or OpenGraph. null for TEXT and FILE input. BLOCKED means the
            platform refused automated reading; the UI asks for a screenshot.
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SourceMetadata" }]
        ocr_text:
          type: string
          maxLength: 2000
          description: >
            Text the model read in an uploaded image (FILE input only, "" otherwise).
            Tactics with source "ocr" are highlighted in it, labelled "dibaca dari gambar".
      required:
        [schema_version, id, timestamp, input_type, source_reference,
         degraded, is_demo, verdict, pillars, tactics, share_token]

    SourceMetadata:
      type: object
      properties:
        status: { type: string, enum: [OK, BLOCKED, UNAVAILABLE] }
        platform: { type: string, enum: [youtube, tiktok, x, instagram, facebook, threads, web] }
        via: { type: string, enum: [oembed, opengraph, ""] }
        title: { type: string, maxLength: 300 }
        author: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        site_name: { type: string, maxLength: 80 }
      required: [status, platform, via, title, author, description, site_name]

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                [INVALID_URL, BLOCKED_TARGET, UNSUPPORTED_MEDIA,
                 PAYLOAD_TOO_LARGE, RATE_LIMITED, UPSTREAM_TIMEOUT, INTERNAL]
            message: { type: string }
            retryable: { type: boolean }
          required: [code, message, retryable]
      required: [error]
